# SignalScope Experiment Configuration
# Configurable for Google Colab GPU training and local reproducibility.

experiment:
  name: "signalscope_baseline_vit"
  output_dir: "experiments/baseline_vit"
  seed: 42
  description: "SignalScope primary candidate (ViT-Base/16) on GenImage dataset"

model:
  backbone: "vit_base_patch16_224"     # Primary candidate (or "convnext_tiny" fallback)
  fallback_backbone: "convnext_tiny"
  pretrained: true
  dropout: 0.2
  image_size: 224

data:
  data_dir: "data"                      # Local image-folder dataset (real/ vs fake/ subdirs)
  train_data_path: null                 # Unused by the loader (create_development_splits reads data_dir)
  val_data_path: null                   # Unused by the loader (create_development_splits reads data_dir)
  held_out_test_dir: "C:\\Datasets\\SignalScope\\test"  # Official evaluation benchmark (STRICTLY ISOLATED)
  unseen_data_path: null                # Optional explicit path
  train_ratio: 0.70
  val_seen_ratio: 0.15
  val_unseen_ratio: 0.15
  unseen_generators: null               # Generator names to reserve (e.g. ["midjourney"])

training:
  batch_size: 32                        # Batch size for Colab T4 GPU
  epochs: 5                             # Training epochs (governed by early stopping)
  learning_rate: 0.0001
  weight_decay: 0.01
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 1
  mixed_precision: true                 # Enabled for 2x faster GPU training
  early_stopping_patience: 2
  device: "auto"                        # Automatically selects CUDA if available, else CPU
  num_workers: 2                        # DataLoader worker processes

evaluation:
  default_threshold: 0.5
  save_confusion_matrix: true
  save_roc_curve: true
