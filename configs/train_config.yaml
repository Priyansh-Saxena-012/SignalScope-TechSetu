# SignalScope Experiment Configuration
# Configurable for Google Colab GPU training and local reproducibility.

experiment:
  name: "signalscope_baseline_vit"
  output_dir: "experiments/baseline_vit"
  seed: 42
  description: "SignalScope primary candidate (ViT-Base/16) on GenImage dataset"

model:
  backbone: "vit_base_patch16_224"     # Primary candidate (or "convnext_tiny" fallback)
  fallback_backbone: "convnext_tiny"
  pretrained: true
  dropout: 0.2
  image_size: 224

data:
  data_dir: null                        # To be specified when GenImage is mounted (e.g., "data/genimage")
  held_out_test_dir: "C:\\Datasets\\SignalScope\\test"  # Official held-out test benchmark (STRICTLY ISOLATED)
  train_data_path: "C:\\Datasets\\SignalScope_Train\\data\\train-*.parquet"
  val_data_path: "C:\\Datasets\\SignalScope_Train\\data\\validation-*.parquet"
  unseen_data_path: null                # Optional explicit path
  train_ratio: 0.70
  val_seen_ratio: 0.15
  val_unseen_ratio: 0.15
  unseen_generators: null               # Generator names to reserve (e.g. ["midjourney"])

training:
  batch_size: 32                        # Batch size for Colab T4 GPU
  epochs: 5                             # Training epochs (governed by early stopping)
  learning_rate: 0.0001
  weight_decay: 0.01
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 1
  mixed_precision: true                 # Enabled for 2x faster GPU training
  early_stopping_patience: 2
  num_workers: 0                        # Safe default for Windows DataLoader
  max_batches_per_epoch: null           # Null for full training, set integer for fast verification
  device: "auto"                        # Automatically selects CUDA if available, else CPU

evaluation:
  default_threshold: 0.5
  save_confusion_matrix: true
  save_roc_curve: true
